<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Financiero · Restaurante Sul</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1d2433;--mute:#6b7280;--line:#e6e2d9;--soft:#faf8f3;
  --brand:#b4412c;--brand-ink:#ffffff;--good:#0f8a6d;--bad:#c8372d;--warn:#b86e00;
  --good-bg:#e3f4ee;--bad-bg:#fbe7e4;--warn-bg:#fdf0d9;--info-bg:#e8eefb;--info:#2b4f9e;
  --in:#0f9d8a;--out:#e0813a;--shadow:0 1px 2px rgba(29,36,51,.06),0 4px 14px rgba(29,36,51,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161b;--card:#1d2027;--ink:#eceff4;--mute:#9aa3b2;--line:#2c313b;--soft:#22262e;
  --brand:#e0674f;--good:#3ccaa3;--bad:#ff7b6f;--warn:#f0b24a;
  --good-bg:#12332b;--bad-bg:#3a1c19;--warn-bg:#3a2d12;--info-bg:#1b2742;--info:#8fb0ff;
  --in:#2fc9b4;--out:#f2a05a;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
a{color:inherit}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:17px;padding:4px 10px 14px;line-height:1.2}
.logo small{display:block;font-weight:500;color:var(--mute);font-size:12px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink)}
#nav a:hover{background:var(--soft)}
#nav a.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
#nav a .ic{width:20px;text-align:center}
main{padding:22px clamp(14px,3vw,34px) 60px;max-width:1180px;width:100%}
.vh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mb{display:flex;gap:6px;align-items:center}
.mb input{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:750;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mute)}
.verdict{border-radius:16px;padding:20px 22px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.verdict.win{background:var(--good-bg);border:1px solid var(--good)}
.verdict.lose{background:var(--bad-bg);border:1px solid var(--bad)}
.verdict.none{background:var(--info-bg);border:1px solid var(--info)}
.verdict .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.verdict.win .big,.verdict.win .t{color:var(--good)}
.verdict.lose .big,.verdict.lose .t{color:var(--bad)}
.verdict .t{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.verdict p{margin:4px 0 0;color:var(--mute);max-width:520px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-good{background:var(--good-bg);color:var(--good)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}
.bar{height:12px;background:var(--soft);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--in);border-radius:99px}
.bar.over>i{background:var(--good)}
.alerts{display:grid;gap:8px}
.al{padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:9px}
.al.bad{background:var(--bad-bg);color:var(--bad)}.al.warn{background:var(--warn-bg);color:var(--warn)}.al.info{background:var(--info-bg);color:var(--info)}
.al b{font-weight:700}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form.f label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}
form.f input,form.f select,.modal input,.modal select,.fl input,.fl select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:10px 16px;font-weight:650;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
tr.sub td{color:var(--mute);font-size:13px}
tr.tot td{font-weight:750;background:var(--soft)}
.catrow{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.catrow .bar{height:10px}.catrow .bar>i{background:var(--out)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg text{fill:var(--mute);font-size:11px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.modal{padding:20px}
.modal form{display:grid;gap:10px}
.modal label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}
.ing{display:grid;grid-template-columns:1fr 90px 28px;gap:6px;align-items:center;margin-bottom:6px}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;font-weight:600}
#toast.on{opacity:1}
.hint{font-size:12.5px;color:var(--mute)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fl select{width:auto}
@media (max-width:0px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:30;overflow-x:auto}
  .logo{display:none}
  #nav{flex-direction:row;gap:2px}
  #nav a{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;white-space:nowrap}
  main{padding-bottom:96px}
  .catrow{grid-template-columns:110px 1fr 90px}
  .verdict .big{font-size:26px}
}
#app[hidden]{display:none}
#auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
#auth[hidden]{display:none}
#auth .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(400px,100%);box-shadow:var(--shadow)}
#auth form{display:grid;gap:10px;margin:14px 0 6px}
#auth label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}
#auth input{padding:11px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
#auth .err{color:var(--bad);font-size:13.5px;min-height:18px}
.who{margin-top:auto;font-size:12.5px;color:var(--mute);padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.who[hidden]{display:none}
.mobbar{display:none;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:10px;gap:8px}
@media (max-width:0px){.who{display:none}.mobbar:not([hidden]){display:flex}}
@media print{
  #side,.mb,.noprint,.btn,#toast{display:none!important}
  #app{display:block}body{background:#fff;color:#000}.card,.kpi{box-shadow:none;border-color:#bbb}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand-row"><span class="brand-ic" id="bic">R</span><span class="brand-t"><b id="rname">Restaurante Sul</b><small>Restaurante &amp; finanzas</small></span></div>
    <nav id="nav"></nav>
    <div class="who" id="who" hidden></div>
  </aside>
  <div id="content"><header id="top"></header><main id="view"></main></div>
</div>
<div id="scrim" data-act="menu"></div>
<button id="fab" data-act="quick" aria-label="Registro rápido"></button>
<div id="auth" hidden><div class="box"><div class="logo" style="padding:0"><span id="aname">Restaurante Sul</span><small>Control financiero</small></div><div id="authBody"></div></div></div>
<dialog id="dlg"><div class="modal" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>

<style>
/* ===== Rediseño: estructura tipo panel lateral + barra superior ===== */
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1d2433;--mute:#6b7280;--line:#e6e2d9;--soft:#faf8f3;
  --brand:#b4412c;--brand-ink:#ffffff;--brand-soft:#fbeae6;--good:#0f8a6d;--bad:#c8372d;--warn:#b86e00;
  --good-bg:#e3f4ee;--bad-bg:#fbe7e4;--warn-bg:#fdf0d9;--info-bg:#e8eefb;--info:#2b4f9e;--in:#0f9d8a;--out:#e0813a;--shadow:none}
html[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--ink:#eceff4;--mute:#9aa3b2;--line:#2c313b;--soft:#22262e;
  --brand:#e0674f;--brand-ink:#ffffff;--brand-soft:#3a201b;--good:#3ccaa3;--bad:#ff7b6f;--warn:#f0b24a;
  --good-bg:#12332b;--bad-bg:#3a1c19;--warn-bg:#3a2d12;--info-bg:#1b2742;--info:#8fb0ff;--in:#2fc9b4;--out:#f2a05a;--shadow:none}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{grid-template-columns:240px minmax(0,1fr)}
#side{width:240px;padding:0 0 14px;gap:0;overflow-y:auto;background:var(--card)}
.brand-row{display:flex;gap:12px;align-items:center;padding:20px 18px 12px}
.brand-ic{width:44px;height:44px;flex:none;border-radius:13px;background:linear-gradient(135deg,#b4412c,#d2603f);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.brand-ic.sm{width:36px;height:36px;font-size:16px;border-radius:11px}
.brand-t b{display:block;letter-spacing:.07em;font-size:16px;font-weight:800;text-transform:uppercase;line-height:1.15}
.brand-t small{font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.nav-label{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;font-weight:700;padding:20px 24px 6px}
#nav{gap:0}
#nav a{height:46px;padding:0 14px;margin:2px 10px;border-radius:12px;gap:14px;font-size:15px;font-weight:500;color:var(--ink)}
#nav a .ic{width:20px;height:20px;display:grid;place-items:center}
#nav a:hover{background:var(--soft)}
#nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
#content{min-width:0;display:flex;flex-direction:column}
#top{height:64px;margin:0 clamp(16px,3vw,40px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}
.top-brand{display:none}
.top-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.tbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.tbtn:hover{filter:brightness(.97)}
.mb{background:var(--brand-soft);border-radius:999px;padding:4px;gap:2px}
.mb .ib{border:0;background:transparent;border-radius:50%;color:var(--brand);width:34px;height:34px;font-weight:700}
.mb input{border:0;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600}
main{padding:30px clamp(16px,3vw,40px) 100px;max-width:none}
.vh{justify-content:flex-start;gap:16px;margin-bottom:22px;flex-wrap:nowrap}
.vh .ic{width:46px;height:46px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.vh h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.vh p{margin:3px 0 0;color:var(--mute);font-size:14px}
.card{border-radius:18px;padding:22px;box-shadow:none}
.card h2{font-size:18px;font-weight:750;letter-spacing:-.01em}
.kpi{border-radius:18px;padding:18px;box-shadow:none}
.verdict{border-radius:20px}
.btn{background:linear-gradient(135deg,#b4412c,#cc5a3b);border-radius:999px;padding:12px 22px;font-weight:700;color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 14px}
form.f input,form.f select,.modal input,.modal select,.fl input,.fl select{padding:12px 14px;border-radius:12px;background:var(--card)}
.badge{border-radius:999px}
.bar>i{background:linear-gradient(90deg,#b4412c,#d2603f)}
.bar.over>i{background:var(--good)}
.who{border-top:1px solid var(--line);margin:auto 10px 0;padding:12px 8px}
#fab{position:fixed;right:24px;bottom:24px;z-index:40;border:0;border-radius:999px;padding:14px 22px;background:linear-gradient(135deg,#b4412c,#cc5a3b);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(180,65,44,.4);cursor:pointer;display:flex;gap:8px;align-items:center}
#fab[hidden]{display:none}
.modal form.two{grid-template-columns:1fr 1fr}
.modal form.two .row{grid-column:1/-1}
.top-brand{display:none}
.menu-btn{display:none}
#scrim{display:none}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:84vw;height:auto;z-index:60;transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav-open #side{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  body.nav-open #scrim{display:block}
  .menu-btn{display:grid}
  #top{height:58px;gap:8px}
  .mb input{padding:7px 8px;font-size:13px}
  main{padding-bottom:90px}
  .vh h1{font-size:22px}
  .vh .ic{width:40px;height:40px}
  #fab{bottom:20px;right:14px;padding:12px 16px}
  #fab span{display:none}
  .modal form.two{grid-template-columns:1fr}
}
@media print{#top,#fab{display:none!important}}
</style>

<script>
'use strict';
/* ============ Datos y utilidades ============ */
const LS='restaurante_sul_v1';
const CATS=[
 ['insumos','Insumos y mercado','var',1],['bebidas','Bebidas y licores','var',1],
 ['empaques','Empaques y desechables','var',0],['gas','Gas','var',0],['comisiones','Comisiones y datáfono','var',0],
 ['nomina','Nómina y prestaciones','fijo',0],['arriendo','Arriendo','fijo',0],['servicios','Servicios públicos e internet','fijo',0],
 ['marketing','Publicidad y redes','fijo',0],['mant','Mantenimiento y reparaciones','fijo',0],
 ['impuestos','Impuestos, licencias y contador','fijo',0],['financiero','Créditos y gastos financieros','fijo',0],['otros','Otros','var',0]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],{id:c[0],n:c[1],t:c[2],cogs:!!c[3]}]));
const CFG0={nombre:'Restaurante Sul',moneda:'COP',inc:8,incIncluido:true,comApps:0,comTarjeta:0,metaFood:32,metaMargen:10,carga:50};
const COLL={venta:'ventas',gasto:'gastos',empleado:'empleados',insumo:'insumos',recurrente:'recurrentes',plato:'platos'};
const NAME={venta:'venta',gasto:'gasto',empleado:'empleado',insumo:'insumo',recurrente:'gasto fijo',plato:'plato'};
const METODOS=['Efectivo','Transferencia','Tarjeta','Crédito con proveedor','Otro'];
const catOpts=CATS.map(c=>[c[0],c[1]]);
const SCH={
 venta:[['fecha','Fecha','date'],['efectivo','Efectivo','money'],['tarjeta','Tarjeta / datáfono','money'],['transf','Transferencias','money'],['apps','Apps de domicilio','money'],['propinas','Propinas (no son ingreso)','money'],['tickets','Cuentas / clientes','int'],['contado','Efectivo contado en caja','money'],['nota','Nota','text']],
 gasto:[['fecha','Fecha','date'],['cat','Categoría','select',catOpts],['tipo','Tipo','select',[['fijo','Fijo'],['var','Variable']]],['proveedor','Proveedor / a quién','text'],['desc','Detalle','text'],['monto','Monto','money'],['estado','Estado','select',[['pagado','Pagado'],['pendiente','Pendiente de pago']]],['vence','Vence (si está pendiente)','date'],['metodo','Medio de pago','select',METODOS.map(m=>[m,m])]],
 empleado:[['nombre','Nombre','text'],['cargo','Cargo','text'],['salario','Salario mensual','money'],['extras','Auxilios / bonos mensuales','money'],['activo','Estado','select',[['1','Activo'],['0','Retirado']]]],
 insumo:[['nombre','Insumo','text'],['unidad','Unidad (kg, lt, und…)','text'],['costo','Costo por unidad','money']],
 recurrente:[['nombre','Concepto','text'],['cat','Categoría','select',catOpts],['monto','Monto mensual','money'],['dia','Día del mes en que vence','int']]
};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const hoy=()=>iso(new Date());
const addMes=(m,d)=>{const [y,mo]=m.split('-').map(Number);const dt=new Date(y,mo-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')};
const diasMes=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const mesLabel=m=>{const [y,mo]=m.split('-').map(Number);const s=new Date(y,mo-1,1).toLocaleDateString('es',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const fdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const num=v=>Number(v)||0;
function fmt(n){const dec=['USD','EUR'].includes(S.cfg.moneda)?2:0;try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:S.cfg.moneda,maximumFractionDigits:dec,minimumFractionDigits:dec}).format(n||0)}catch(e){return (n||0).toFixed(0)}}
const fk=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?Math.round(a/1e3)+'k':Math.round(a))};
const pct=(x,d=1)=>(x*100).toFixed(d).replace('.',',')+'%';

/* ============ Cálculos ============ */
function calc(mes){
  const vs=S.ventas.filter(v=>v.fecha.slice(0,7)===mes), gs=S.gastos.filter(g=>g.fecha.slice(0,7)===mes);
  const efectivo=sum(vs,v=>v.efectivo),tarjeta=sum(vs,v=>v.tarjeta),transf=sum(vs,v=>v.transf),apps=sum(vs,v=>v.apps);
  const bruto=efectivo+tarjeta+transf+apps,propinas=sum(vs,v=>v.propinas),tickets=sum(vs,v=>v.tickets);
  const r=num(S.cfg.inc)/100,k=S.cfg.incIncluido&&r>0?1/(1+r):1;
  const neta=bruto*k,impuesto=bruto-neta;
  const compras=sum(gs.filter(g=>CAT[g.cat]&&CAT[g.cat].cogs),g=>g.monto);
  const ini=S.inv[addMes(mes,-1)],fin=S.inv[mes];
  const hasInv=ini!==undefined&&fin!==undefined;
  const cogs=hasInv?compras+ini-fin:compras;
  const opex=gs.filter(g=>!(CAT[g.cat]&&CAT[g.cat].cogs));
  const fijos=sum(opex.filter(g=>g.tipo==='fijo'),g=>g.monto),varOp=sum(opex.filter(g=>g.tipo!=='fijo'),g=>g.monto);
  const comis=tarjeta*num(S.cfg.comTarjeta)/100+apps*num(S.cfg.comApps)/100;
  const utilBruta=neta-cogs,utilOp=utilBruta-fijos-varOp-comis;
  const margen=neta>0?utilOp/neta:0,food=neta>0?cogs/neta:0;
  const vr=neta>0?(cogs+varOp+comis)/neta:num(S.cfg.metaFood)/100;
  const be=vr<1?fijos/(1-vr):Infinity;
  const dim=diasMes(mes),cur=hoy().slice(0,7);
  const elapsed=mes===cur?new Date().getDate():(mes<cur?dim:0);
  const proj=mes===cur&&elapsed>0?neta/elapsed*dim:neta;
  const utilProj=mes===cur?proj*(1-vr)-fijos:utilOp;
  const prorr=mes===cur&&elapsed>0&&elapsed<dim;
  const fijosVer=prorr?fijos*elapsed/dim:fijos;
  const utilVer=utilBruta-fijosVer-varOp-comis,margenVer=neta>0?utilVer/neta:0;
  const byCat={};gs.forEach(g=>byCat[g.cat]=(byCat[g.cat]||0)+num(g.monto));
  const gastosTot=sum(gs,g=>g.monto);
  const days=[];for(let d=1;d<=dim;d++){const ds=mes+'-'+String(d).padStart(2,'0');days.push({d,v:sum(vs.filter(v=>v.fecha===ds),v=>num(v.efectivo)+num(v.tarjeta)+num(v.transf)+num(v.apps))*k,g:sum(gs.filter(g=>g.fecha===ds),g=>g.monto)})}
  const conteo=vs.filter(v=>v.contado!==''&&v.contado!=null&&!isNaN(v.contado));
  const descuadre=sum(conteo,v=>num(v.contado)-num(v.efectivo));
  const nDesc=conteo.filter(v=>Math.round(num(v.contado)-num(v.efectivo))!==0).length;
  return{mes,vs,gs,efectivo,tarjeta,transf,apps,bruto,propinas,tickets,neta,impuesto,compras,cogs,hasInv,fijos,varOp,comis,
    utilBruta,utilOp,margen,food,vr,be,prorr,fijosVer,utilVer,margenVer,dim,elapsed,proj,utilProj,byCat,gastosTot,days,descuadre,nDesc,opexTot:fijos+varOp+comis,
    nVentas:vs.length,nGastos:gs.length};
}
const platoCosto=p=>sum(p.ings||[],i=>{const x=S.insumos.find(z=>z.id===i.ins);return x?num(x.costo)*num(i.qty):0});
const precioNeto=p=>{const r=num(S.cfg.inc)/100;return S.cfg.incIncluido&&r>0?num(p)/(1+r):num(p)};
const nominaEmp=e=>num(e.salario)*(1+num(S.cfg.carga)/100)+num(e.extras);
const nominaTotal=(list=S.empleados)=>sum(list.filter(e=>e.activo!=='0'&&e.activo!==0),nominaEmp);

/* ============ Gráficos SVG ============ */
function chartDias(c){
  const W=720,H=230,p={l:44,r:8,t:10,b:24};
  const max=Math.max(1,...c.days.map(d=>Math.max(d.v,d.g)));
  const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/c.days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ventas y gastos por día">`;
  for(let i=0;i<=4;i++){const y=p.t+ih-ih*i/4;s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${fk(max*i/4)}</text>`}
  c.days.forEach((d,i)=>{
    const x=p.l+i*bw,vh=ih*d.v/max,gh=ih*d.g/max;
    s+=`<g><title>${d.d}/${c.mes.slice(5)} · Ventas ${fmt(d.v)} · Gastos ${fmt(d.g)}</title>`;
    if(d.v>0)s+=`<rect x="${x+bw*.08}" y="${p.t+ih-vh}" width="${bw*.4}" height="${vh}" rx="2" fill="var(--in)"/>`;
    if(d.g>0)s+=`<rect x="${x+bw*.5}" y="${p.t+ih-gh}" width="${bw*.4}" height="${gh}" rx="2" fill="var(--out)"/>`;
    s+='</g>';
    if(d.d===1||d.d%5===0)s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${d.d}</text>`;
  });
  return s+'</svg>';
}
function chartMeses(list){
  const W=720,H=220,p={l:50,r:8,t:14,b:26};
  const vals=list.map(x=>x.utilOp),mx=Math.max(1,...vals.map(Math.abs));
  const iw=W-p.l-p.r,ih=H-p.t-p.b,bw=iw/list.length,y0=p.t+ih/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Utilidad por mes">`;
  s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  s+=`<text x="${p.l-6}" y="${p.t+4}" text-anchor="end">${fk(mx)}</text><text x="${p.l-6}" y="${p.t+ih+4}" text-anchor="end">${fk(-mx)}</text>`;
  list.forEach((c,i)=>{
    const h=Math.abs(c.utilOp)/mx*(ih/2),x=p.l+i*bw+bw*.2,up=c.utilOp>=0;
    s+=`<g><title>${mesLabel(c.mes)} · Utilidad ${fmt(c.utilOp)}</title><rect x="${x}" y="${up?y0-h:y0}" width="${bw*.6}" height="${Math.max(h,1)}" rx="3" fill="${up?'var(--good)':'var(--bad)'}"/></g>`;
    s+=`<text x="${x+bw*.3}" y="${up?y0-h-4:y0+h+12}" text-anchor="middle">${fk(c.utilOp)}</text>`;
    s+=`<text x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${mesLabel(c.mes).slice(0,3)}</text>`;
  });
  return s+'</svg>';
}

function field(kind,[n,l,t,opts],v){
  const val=v?.[n]??'';
  if(t==='select')return `<label>${l}<select name="${n}">${opts.map(o=>`<option value="${esc(o[0])}"${String(val)===String(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if(t==='money')return `<label>${l}<input type="number" name="${n}" min="0" step="any" inputmode="decimal" value="${val}"></label>`;
  if(t==='int')return `<label>${l}<input type="number" name="${n}" min="0" step="1" inputmode="numeric" value="${val}"></label>`;
  if(t==='date')return `<label>${l}<input type="date" name="${n}" value="${val}"${n==='fecha'?' required':''}></label>`;
  return `<label>${l}<input type="text" name="${n}" value="${esc(val)}" autocomplete="off"></label>`;
}

function alertas(c){
  const a=[],cur=hoy().slice(0,7),meta=num(S.cfg.metaFood);
  if(c.neta>0&&c.food*100>meta)a.push(['bad',`Tu costo de ventas es <b>${pct(c.food)}</b>, por encima de la meta de ${meta}%. Revisa porciones, desperdicio, precios de proveedor y robos.`]);
  const venc=pendientes().filter(g=>(g.vence||g.fecha)<hoy());
  if(venc.length)a.push(['bad',`Tienes <b>${venc.length}</b> pago(s) vencido(s) por <b>${fmt(sum(venc,g=>g.monto))}</b>. Ve a "Por pagar".`]);
  if(c.nDesc)a.push(['warn',`Descuadre de caja en <b>${c.nDesc}</b> cierre(s): ${c.descuadre<0?'faltan':'sobran'} <b>${fmt(Math.abs(c.descuadre))}</b> en efectivo este mes.`]);
  if(c.mes===cur&&new Date().getDate()>=3){
    const last=S.ventas.map(v=>v.fecha).sort().pop();
    const lim=iso(new Date(Date.now()-2*864e5));
    if(!last||last<lim)a.push(['warn',`No registras ventas desde ${last?'<b>'+fdate(last)+'</b>':'hace mucho'}. Un dato faltante daña todo el reporte.`]);
  }
  const bad=S.platos.filter(p=>num(p.precio)>0&&platoCosto(p)/precioNeto(p.precio)*100>meta+8);
  if(bad.length)a.push(['warn',`<b>${bad.length}</b> plato(s) con costo muy alto (más de ${meta+8}% del precio): ${bad.slice(0,3).map(p=>esc(p.nombre)).join(', ')}${bad.length>3?'…':''}.`]);
  if(c.mes===cur&&S.recurrentes.length&&!S.gastos.some(g=>g.ref&&g.ref.startsWith('rec-')&&g.fecha.slice(0,7)===cur))a.push(['info','Aún no has generado los gastos fijos de este mes. Ve a "Nómina y fijos" → "Generar gastos fijos".']);
  if(c.apps+c.tarjeta>0&&!num(S.cfg.comApps)&&!num(S.cfg.comTarjeta))a.push(['info','No has configurado las comisiones de datáfono y apps de domicilio (Ajustes). Tu utilidad real puede ser menor a la mostrada.']);
  const dias=S.lastBackup?(Date.now()-S.lastBackup)/864e5:Infinity;
  if((S.ventas.length||S.gastos.length)&&dias>7)a.push(['info',`Tu último respaldo fue ${S.lastBackup?'hace '+Math.floor(dias)+' días':'<b>nunca</b>'}. Descarga uno en Ajustes para no perder tu información.`]);
  return a;
}

    ${kpi('Gastos de operación',fmt(c.fijosVer+c.varOp+c.comis),`Fijos ${fmt(c.fijosVer)}${c.prorr?' (a hoy)':''} · Variables ${fmt(c.varOp+c.comis)}`)}
    ${kpi(c.prorr?'Utilidad a hoy':'Utilidad del mes',fmt(c.utilVer),`Margen ${pct(c.margenVer)}`,c.utilVer>=0?'good':'bad')}
    ${kpi('Por pagar (total)',fmt(pTot),vencidos?`${vencidos} vencido(s)`:`${pend.length} pendiente(s)`,vencidos?'bad':'')}
  </div>`;
  const beOk=isFinite(c.be)&&c.be>0;
  const prog=beOk?Math.min(100,c.neta/c.be*100):0;
  const beCard=`<div class="card"><h2>Punto de equilibrio</h2>${beOk?`<div class="bar ${c.neta>=c.be?'over':''}"><i style="width:${prog}%"></i></div>

    ${c.mes===hoy().slice(0,7)&&c.elapsed>0?`<br>Al ritmo actual cerrarás el mes en <b>${fmt(c.proj)}</b> y ${c.utilProj>=0?'ganarías':'perderías'} aprox. <b class="${c.utilProj>=0?'good':'bad'}">${fmt(Math.abs(c.utilProj))}</b>.`:''}</p>
    <p class="hint" style="margin:6px 0 0">Calculado con tus gastos fijos (${fmt(c.fijos)}) y que cada ${fmt(100)} de venta consume ${fmt(c.vr*100)} en costos variables.</p>`
    :'<p class="mute">Registra ventas y gastos para calcular el punto de equilibrio.</p>'}</div>`;
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);

  const al=alertas(c);

/* ============ Acciones ============ */
function collect(kind,f){const o={};for(const [n,,t] of SCH[kind]){const el=f.elements[n];if(!el)continue;let v=el.value.trim?el.value.trim():el.value;if(t==='money'||t==='int')v=v===''?'':Number(v);o[n]=v}return o}
function validate(kind,o){
  if(kind==='venta'&&!(num(o.efectivo)+num(o.tarjeta)+num(o.transf)+num(o.apps)>0))return 'Ingresa al menos un valor de venta.';
  if(kind==='gasto'&&!(num(o.monto)>0))return 'El monto debe ser mayor a 0.';
  if(kind==='empleado'&&(!o.nombre||!(num(o.salario)>0)))return 'Nombre y salario son obligatorios.';
  if(kind==='insumo'&&(!o.nombre||o.costo===''))return 'Nombre y costo son obligatorios.';
  if(kind==='recurrente'&&(!o.nombre||!(num(o.monto)>0)||!(o.dia>=1&&o.dia<=31)))return 'Completa concepto, monto y día (1–31).';
  return '';
}
function onSubmit(f){
  const [mode,kind,id]=f.dataset.form.split(':');
  if(mode==='cfg'){
    const c=S.cfg,g=n=>f.elements[n].value;
    c.nombre=g('nombre')||'Restaurante';c.moneda=g('moneda');c.incIncluido=g('incIncluido')==='1';
    ['inc','comTarjeta','comApps','metaFood','metaMargen','carga'].forEach(n=>c[n]=num(g(n)));
    save();render();toast('Ajustes guardados');return;
  }
  if(mode==='plato'){return savePlato(f,kind)}
  const o=collect(kind,f),err=validate(kind,o);
  if(err){toast(err);return}
  if(kind==='gasto'&&o.estado==='pendiente'&&!o.vence)o.vence=o.fecha;
  if(kind==='gasto'&&o.estado!=='pendiente')o.vence='';
  const list=S[COLL[kind]];
  if(mode==='add'){list.push({id:uid(),...o});if(o.fecha)ui.lastFecha=o.fecha;if(o.fecha&&(kind==='venta'||kind==='gasto')){ui.mes=o.fecha.slice(0,7)}}
  else{const it=list.find(x=>x.id===id);Object.assign(it,o)}
  save();$('#dlg').close();render();toast(mode==='add'?'Guardado ✔':'Cambios guardados ✔');
}
function savePlato(f,id){
  const nombre=f.elements.nombre.value.trim(),precio=num(f.elements.precio.value);
  const ings=[...f.querySelectorAll('.ing')].map(r=>({ins:r.querySelector('select').value,qty:num(r.querySelector('input').value)})).filter(i=>i.ins&&i.qty>0);
  if(!nombre||!(precio>0)||!ings.length){toast('Falta nombre, precio o ingredientes.');return}
  if(id){Object.assign(S.platos.find(p=>p.id===id),{nombre,precio,ings})}else S.platos.push({id:uid(),nombre,precio,ings});
  save();$('#dlg').close();render();toast('Plato guardado ✔');
}
function ingRow(i){return `<div class="ing"><select>${S.insumos.map(x=>`<option value="${x.id}"${i&&i.ins===x.id?' selected':''}>${esc(x.nombre)} (${esc(x.unidad)})</option>`).join('')}</select><input type="number" min="0" step="any" inputmode="decimal" placeholder="Cantidad" value="${i?i.qty:''}"><button type="button" class="ib" data-act="delIng" aria-label="Quitar" style="width:28px;height:28px;font-size:14px">✕</button></div>`}
function platoCalcUpdate(){
  const f=$('#dlgBody form');if(!f||!f.elements.precio)return;
  const co=sum([...f.querySelectorAll('.ing')],r=>{const x=S.insumos.find(z=>z.id===r.querySelector('select').value);return x?num(x.costo)*num(r.querySelector('input').value):0});
  const pn=precioNeto(f.elements.precio.value),pc=pn>0?co/pn*100:0,meta=num(S.cfg.metaFood);
  $('#platoCalc').innerHTML=`Costo: <b>${fmt(co)}</b> · Costo / precio neto: <b class="${sem(pc,meta)}">${pc.toFixed(0)}%</b> · Te deja <b>${fmt(pn-co)}</b>`;
}

function genFijos(){
  const mes=ui.mes,dim=diasMes(mes);let n=0;
  S.recurrentes.forEach(r=>{
    const ref='rec-'+r.id+'-'+mes;if(S.gastos.some(g=>g.ref===ref))return;
    const f=mes+'-'+String(Math.min(r.dia,dim)).padStart(2,'0');
    S.gastos.push({id:uid(),ref,fecha:f,cat:r.cat,tipo:'fijo',proveedor:r.nombre,desc:'Gasto fijo recurrente',monto:r.monto,estado:'pendiente',vence:f,metodo:'Transferencia',demo:r.demo});n++;
  });
  save();render();toast(n?`${n} gasto(s) fijo(s) generado(s) ✔`:'Ya estaban generados todos los de este mes');
}

/* ============ Nube (Supabase) ============ */
const COLLS=['ventas','gastos','insumos','platos','empleados','recurrentes'];
const DATED={ventas:1,gastos:1};
let snap={},pushQ=Promise.resolve(),pushing=0;
const jstr=o=>JSON.stringify(o);
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
function takeSnap(){
  COLLS.forEach(t=>snap[t]=new Map(S[t].map(o=>[o.id,jstr(o)])));
  snap.cfg=jstr(S.cfg);snap.inv=jstr(S.inv);
}
const rowOf=(t,o)=>DATED[t]?{id:o.id,fecha:o.fecha,data:o}:{id:o.id,data:o};
function queuePush(){pushing++;pushQ=pushQ.then(pushChanges).catch(()=>{}).then(()=>{pushing--})}
async function pushChanges(){
  try{
    for(const t of COLLS){
      const cur=new Map(S[t].map(o=>[o.id,jstr(o)])),ins=[],upd=[],del=[];
      S[t].forEach(o=>{const s=snap[t].get(o.id);if(s===undefined)ins.push(rowOf(t,o));else if(s!==cur.get(o.id))upd.push(rowOf(t,o))});
      snap[t].forEach((_,id)=>{if(!cur.has(id))del.push(id)});
      for(const part of chunk(ins,500)){const {error}=await sb.from(t).insert(part);if(error)throw error}
      for(const part of chunk(upd,500)){const {error}=await sb.from(t).upsert(part);if(error)throw error}
      for(const part of chunk(del,100)){const {error}=await sb.from(t).delete().in('id',part);if(error)throw error}
      snap[t]=cur;
    }
    for(const k of ['cfg','inv']){
      const j=jstr(S[k]);
      if(j!==snap[k]){const {error}=await sb.from('ajustes').upsert({key:k,data:S[k]});if(error)throw error;snap[k]=j}
    }
  }catch(e){
    toast('No se pudo guardar: '+(e.message||e)+'. Se recargan los datos.');
    try{await loadAll();render()}catch(x){}
    throw e;
  }
}
async function fetchAll(t){
  const out=[];let from=0;
  for(;;){
    const {data,error}=await sb.from(t).select('id,data').order('id').range(from,from+999);
    if(error)throw error;out.push(...data);if(data.length<1000)break;from+=1000;
  }
  return out.map(r=>r.data);
}
async function loadAll(){
  const next=blank();next.lastBackup=S.lastBackup;
  for(const t of (isCaj()?['ventas','gastos']:COLLS))next[t]=await fetchAll(t);
  const {data:aj,error}=await sb.from('ajustes').select('key,data');if(error)throw error;
  (aj||[]).forEach(a=>{if(a.key==='cfg')next.cfg=Object.assign({},CFG0,a.data);if(a.key==='inv')next.inv=a.data});
  if(!isCaj()){const {data:pf}=await sb.from('perfiles').select('*').order('creado');perfiles=pf||[]}
  S=next;takeSnap();
}
async function refreshCloud(silent){
  if(pushing||(silent&&($('#dlg').open||(document.activeElement&&document.activeElement!==document.body))))return;
  const before=jstr([S.ventas,S.gastos,S.insumos,S.platos,S.empleados,S.recurrentes,S.cfg,S.inv]);
  try{await loadAll()}catch(e){if(!silent)toast('Sin conexión: '+(e.message||e));return}
  const after=jstr([S.ventas,S.gastos,S.insumos,S.platos,S.empleados,S.recurrentes,S.cfg,S.inv]);
  if(!silent||before!==after){render();if(!silent)toast('Datos actualizados ✔')}
}
function authScreen(html){$('#aname').textContent=AC.NOMBRE||'Restaurante Sul';$('#authBody').innerHTML=html;$('#auth').hidden=false;$('#app').hidden=true}
function showLogin(msg='',mode='in'){
  authScreen(`<form id="authForm"><label>Correo<input type="email" name="email" required autocomplete="username"></label><label>Contraseña${mode==='up'?' (mínimo 8 caracteres)':''}<input type="password" name="pass" required minlength="${mode==='up'?8:1}" autocomplete="${mode==='up'?'new-password':'current-password'}"></label><div class="err" id="aerr">${esc(msg)}</div><button class="btn">${mode==='up'?'Crear cuenta':'Entrar'}</button></form><p class="hint" style="margin:8px 0 0">${mode==='up'?'¿Ya tienes cuenta? <a href="#" id="swAuth">Entrar</a>':'¿Primera vez? <a href="#" id="swAuth">Crear cuenta</a>. Tu acceso lo aprueba el dueño.'}</p>`);
  $('#swAuth').onclick=e=>{e.preventDefault();showLogin('',mode==='up'?'in':'up')};
  $('#authForm').onsubmit=async e=>{
    e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;
    const cred={email:f.email.value.trim(),password:f.pass.value};
    const {data,error}=mode==='up'?await sb.auth.signUp(cred):await sb.auth.signInWithPassword(cred);
    b.disabled=false;
    if(error){$('#aerr').textContent=/invalid login/i.test(error.message)?'Correo o contraseña incorrectos.':/already|registered/i.test(error.message)?'Ese correo ya tiene cuenta. Usa "Entrar".':error.message;return}
    if(!data.session){showLogin('Cuenta creada. Revisa tu correo para confirmarla y luego entra.','in');return}
    enter(data.session);
  };
}
async function enter(session){
  USER=session.user;
  const {data:pf,error}=await sb.from('perfiles').select('rol').eq('id',USER.id).maybeSingle();
  if(error||!pf){authScreen(`<p>No se pudo leer tu perfil. ¿Ejecutaste el archivo <b>schema.sql</b> en Supabase?</p><p class="hint">${esc(error?error.message:'Perfil no encontrado')}</p><button class="btn sec" id="so">Salir</button>`);$('#so').onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  ROL=pf.rol==='dueno'?'dueno':pf.rol==='cajero'?'cajero':'pendiente';
  if(ROL==='pendiente'){authScreen(`<h2 style="margin-top:14px">Esperando aprobación</h2><p>Tu cuenta (${esc(USER.email)}) fue creada. El dueño debe darte acceso desde <b>Ajustes → Quién puede entrar</b>. Vuelve a abrir esta página cuando te avise.</p><div class="row"><button class="btn" id="rt">Revisar de nuevo</button><button class="btn sec" id="so">Salir</button></div>`);$('#rt').onclick=()=>enter(session);$('#so').onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  try{await loadAll()}catch(e){authScreen(`<p>No se pudieron cargar los datos.</p><p class="hint">${esc(e.message||e)}</p><button class="btn sec" id="so">Salir</button>`);$('#so').onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  $('#auth').hidden=true;$('#app').hidden=false;
  if(isCaj())ui.mes=hoy().slice(0,7);
  go();
  setInterval(()=>refreshCloud(true),90000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud(true)});
}
async function boot(){
  if(!CLOUD){go();return}
  $('#app').hidden=true;
  if(!window.supabase){authScreen('<p>No se pudo cargar el servicio en la nube. Revisa tu conexión a internet y recarga.</p>');return}
  sb=window.supabase.createClient(AC.SUPABASE_URL,AC.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();
  if(data.session)enter(data.session);else showLogin();
}
boot();
</script>
